name: Issue Board Sync

# Auto-transition issues on the project board when PR state changes.
# Replaces manual board transitions in /finish-issue and /review-pr.
#
# Project board IDs are read from .argus/project.json — no hardcoded values.

on:
  pull_request:
    types: [opened, closed, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read
  repository-projects: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # Soft-fail: default GITHUB_TOKEN lacks scope for user-level Projects v2.
    # Set PROJECT_TOKEN (PAT with project scope) to enable hard enforcement.
    continue-on-error: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          sparse-checkout: .argus/project.json
          sparse-checkout-cone-mode: false

      - name: Load project config
        id: config
        run: |
          if [ ! -f .argus/project.json ]; then
            echo "No .argus/project.json found. Skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "project_id=$(jq -r '.project.node_id' .argus/project.json)" >> "$GITHUB_OUTPUT"
          echo "project_number=$(jq -r '.project.number' .argus/project.json)" >> "$GITHUB_OUTPUT"
          echo "status_field=$(jq -r '.fields.status.field_id' .argus/project.json)" >> "$GITHUB_OUTPUT"
          echo "status_ready=$(jq -r '.fields.status.options.ready.id' .argus/project.json)" >> "$GITHUB_OUTPUT"
          echo "status_review=$(jq -r '.fields.status.options.review.id' .argus/project.json)" >> "$GITHUB_OUTPUT"
          echo "status_done=$(jq -r '.fields.status.options.done.id' .argus/project.json)" >> "$GITHUB_OUTPUT"

      - name: Extract linked issue number
        if: steps.config.outputs.found == 'true'
        id: issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ISSUE_NUM=$(echo "$PR_BODY" | grep -ioP '(closes|fixes|resolves)\s+#\K\d+' | head -1)
          if [ -z "$ISSUE_NUM" ]; then
            echo "No linked issue found in PR body. Skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$ISSUE_NUM" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Get project item ID
        if: steps.issue.outputs.found == 'true'
        id: item
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM=${{ steps.issue.outputs.number }}
          PROJECT_NUM=${{ steps.config.outputs.project_number }}

          ITEM_ID=$(gh api graphql -f query='
            query($project: Int!, $owner: String!) {
              user(login: $owner) {
                projectV2(number: $project) {
                  items(first: 100) {
                    nodes {
                      id
                      content {
                        ... on Issue { number }
                      }
                    }
                  }
                }
              }
            }' -f owner="${{ github.repository_owner }}" -F project="$PROJECT_NUM" \
            --jq ".data.user.projectV2.items.nodes[] | select(.content.number == $ISSUE_NUM) | .id")

          if [ -z "$ITEM_ID" ]; then
            echo "Issue #$ISSUE_NUM not found on project board. Skipping."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "id=$ITEM_ID" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Transition issue on board
        if: steps.item.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ITEM_ID=${{ steps.item.outputs.id }}
          PROJECT_ID=${{ steps.config.outputs.project_id }}
          FIELD_ID=${{ steps.config.outputs.status_field }}
          EVENT=${{ github.event.action }}
          MERGED=${{ github.event.pull_request.merged }}

          if [ "$EVENT" = "opened" ] || [ "$EVENT" = "reopened" ]; then
            TARGET=${{ steps.config.outputs.status_review }}
            echo "Transitioning to In Review"
          elif [ "$EVENT" = "closed" ] && [ "$MERGED" = "true" ]; then
            TARGET=${{ steps.config.outputs.status_done }}
            echo "Transitioning to Done"
          elif [ "$EVENT" = "closed" ] && [ "$MERGED" = "false" ]; then
            TARGET=${{ steps.config.outputs.status_ready }}
            echo "Transitioning to Ready"
          else
            echo "Unhandled event. Skipping."
            exit 0
          fi

          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $field: ID!, $value: String!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId: $item
                fieldId: $field
                value: { singleSelectOptionId: $value }
              }) { projectV2Item { id } }
            }' \
            -f project="$PROJECT_ID" \
            -f item="$ITEM_ID" \
            -f field="$FIELD_ID" \
            -f value="$TARGET"
